<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Noted</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233F6652'/%3E%3Cg transform='translate(20,20) scale(2.5)' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='6' y='4' width='12' height='17' rx='2'/%3E%3Cpath d='M9 9h6'/%3E%3Cpath d='M9 12.5h6'/%3E%3Cpath d='M9 16h3.5'/%3E%3Cpath d='M19.5 6.5 13 13l-1.5 3.5L15 15l6.5-6.5a1.5 1.5 0 0 0 0-2.1l-.9-.9a1.5 1.5 0 0 0-2.1 0Z'/%3E%3C/g%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    textarea { field-sizing: content; }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .task-row { animation: fade-in-up 0.22s ease-out; }
    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }
    .dot { animation: pulse-dot 1.1s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-in { animation: toast-in 0.2s ease-out; }
  </style>
</head>
<body class="h-dvh flex flex-col bg-[#FAF8F4] dark:bg-[#1B1F1C] text-[#1F2420] dark:text-[#EDEDE6] antialiased overflow-hidden">

  <header class="shrink-0 flex items-center justify-center py-4" style="padding-top: calc(1rem + env(safe-area-inset-top));">
    <div class="flex items-center gap-2">
      <span class="h-7 w-7 rounded-full bg-[#3F6652] dark:bg-[#6B9C82] text-white dark:text-[#1B1F1C] flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <rect x="6" y="4" width="12" height="17" rx="2"/>
          <path d="M9 9h6"/>
          <path d="M9 12.5h6"/>
          <path d="M9 16h3.5"/>
          <path d="M19.5 6.5 13 13l-1.5 3.5L15 15l6.5-6.5a1.5 1.5 0 0 0 0-2.1l-.9-.9a1.5 1.5 0 0 0-2.1 0Z"/>
        </svg>
      </span>
      <span class="text-[15px] font-medium tracking-tight">Noted</span>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto overscroll-contain">
    <div class="max-w-2xl mx-auto w-full px-4 sm:px-5">
      <div id="empty-state" class="hidden min-h-[38vh] sm:min-h-[46vh] flex flex-col items-center justify-center text-center gap-1.5 px-4">
        <h1 class="text-xl sm:text-2xl font-medium text-[#1F2420] dark:text-[#EDEDE6]">What do you need to remember?</h1>
        <p class="text-sm text-[#8C897E] dark:text-[#8B948C]">Type or speak a command and I'll take care of it.</p>
      </div>

      <div id="task-list" class="hidden pb-6">
        <div id="pending-list"></div>

        <div id="completed-section" class="hidden mt-4">
          <button id="completed-toggle" type="button" class="text-xs font-semibold uppercase tracking-wide text-[#8C897E] dark:text-[#8B948C] flex items-center gap-1.5 py-2">
            <svg id="completed-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 transition-transform"><path d="m9 18 6-6-6-6"/></svg>
            <span id="completed-count">Completed</span>
          </button>
          <div id="completed-list" class="hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="shrink-0 bg-gradient-to-t from-[#FAF8F4] via-[#FAF8F4] dark:from-[#1B1F1C] dark:via-[#1B1F1C] pt-6 relative">
    <div class="max-w-2xl mx-auto w-full px-4 sm:px-5" style="padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));">

      <div id="toast" class="hidden toast-in mb-2 flex items-center justify-between gap-3 rounded-2xl border border-[#E4E1D8] dark:border-[#333A34] bg-white dark:bg-[#232824] px-4 py-2.5 text-sm shadow-[0_1px_2px_rgba(0,0,0,0.04),0_4px_16px_rgba(0,0,0,0.06)]">
        <span id="toast-message" class="text-[#1F2420] dark:text-[#EDEDE6]"></span>
        <button id="toast-action" class="hidden shrink-0 font-semibold text-[#3F6652] dark:text-[#6B9C82]"></button>
      </div>

      <div id="clarify-box" class="hidden mb-2 rounded-2xl border border-[#E4E1D8] dark:border-[#333A34] bg-white dark:bg-[#232824] px-4 py-3">
        <p id="clarify-question" class="text-sm text-[#1F2420] dark:text-[#EDEDE6] mb-2"></p>
        <div id="clarify-options" class="flex flex-wrap gap-1.5"></div>
      </div>

      <p id="error-msg" class="text-[#B3401F] dark:text-[#E08A6B] text-sm mb-2 px-1 hidden"></p>

      <div class="relative flex items-end gap-1 sm:gap-1.5 rounded-3xl border border-[#E4E1D8] dark:border-[#333A34] bg-white dark:bg-[#232824] shadow-[0_1px_2px_rgba(0,0,0,0.04),0_4px_16px_rgba(0,0,0,0.06)] px-2.5 sm:px-3 py-2 focus-within:border-[#3F6652] dark:focus-within:border-[#6B9C82] transition-colors">
        <textarea
          id="note-input"
          rows="1"
          enterkeyhint="send"
          placeholder="Message Noted…"
          class="flex-1 resize-none max-h-40 bg-transparent border-0 focus:outline-none focus:ring-0 text-base leading-6 py-1.5 px-1 placeholder:text-[#A6A296] dark:placeholder:text-[#6B7269]"
        ></textarea>

        <button
          id="mic-btn"
          type="button"
          title="Speak your command"
          class="relative shrink-0 h-10 w-10 sm:h-9 sm:w-9 rounded-full flex items-center justify-center text-[#7A776E] dark:text-[#8B948C] hover:bg-[#F0EEE6] dark:hover:bg-white/5 hover:text-[#1F2420] dark:hover:text-[#EDEDE6] active:bg-[#F0EEE6] dark:active:bg-white/5 transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
            <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.07A7 7 0 0 0 19 11Z"/>
          </svg>
          <span id="mic-dot" class="hidden absolute top-1.5 right-1.5 sm:top-1 sm:right-1 h-2 w-2 rounded-full bg-[#D93025] ring-2 ring-white dark:ring-[#232824]"></span>
        </button>

        <button
          id="send-btn"
          type="button"
          title="Send command"
          class="shrink-0 h-10 w-10 sm:h-9 sm:w-9 rounded-full bg-[#3F6652] dark:bg-[#6B9C82] text-white dark:text-[#1B1F1C] flex items-center justify-center hover:opacity-85 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition"
        >
          <svg id="send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[17px] h-[17px]">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
          <span id="loading-dots" class="hidden items-center gap-[3px]">
            <span class="dot h-[5px] w-[5px] rounded-full bg-current"></span>
            <span class="dot h-[5px] w-[5px] rounded-full bg-current"></span>
            <span class="dot h-[5px] w-[5px] rounded-full bg-current"></span>
          </span>
        </button>
      </div>

      <p class="hidden sm:block text-center text-[11px] text-[#A6A296] dark:text-[#6B7269] mt-2">Enter to send · Shift + Enter for a new line</p>
    </div>
  </div>

  <script>
    const noteInput = document.getElementById("note-input");
    const micBtn = document.getElementById("mic-btn");
    const micDot = document.getElementById("mic-dot");
    const sendBtn = document.getElementById("send-btn");
    const sendIcon = document.getElementById("send-icon");
    const loadingDots = document.getElementById("loading-dots");
    const errorMsg = document.getElementById("error-msg");
    const emptyState = document.getElementById("empty-state");
    const taskListEl = document.getElementById("task-list");
    const pendingListEl = document.getElementById("pending-list");
    const completedSection = document.getElementById("completed-section");
    const completedListEl = document.getElementById("completed-list");
    const completedToggle = document.getElementById("completed-toggle");
    const completedCount = document.getElementById("completed-count");
    const completedChevron = document.getElementById("completed-chevron");
    const toastEl = document.getElementById("toast");
    const toastMessage = document.getElementById("toast-message");
    const toastAction = document.getElementById("toast-action");
    const clarifyBox = document.getElementById("clarify-box");
    const clarifyQuestion = document.getElementById("clarify-question");
    const clarifyOptions = document.getElementById("clarify-options");

    const API_BASE = "http://127.0.0.1:8010";

    const PRIORITY_DOT = {
      Low: "bg-[#A6A296] dark:bg-[#6B7269]",
      Medium: "bg-[#B3791F]",
      High: "bg-[#B3401F]",
    };

    const DELETE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="M4 6h16"/><path d="M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6"/><path d="M6 6l1 14a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 17 20l1-14"/></svg>`;
    const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><path d="M20 6 9 17l-5-5"/></svg>`;

    let toastTimer = null;

    // ---------- helpers ----------

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDue(dueDate, dueTime) {
      if (!dueDate) return dueTime || "";
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const d = new Date(dueDate + "T00:00:00");
      const diffDays = Math.round((d - today) / 86400000);
      let label;
      if (diffDays === 0) label = "Today";
      else if (diffDays === 1) label = "Tomorrow";
      else if (diffDays === -1) label = "Yesterday";
      else label = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

      if (dueTime) {
        const [h, m] = dueTime.split(":").map(Number);
        const period = h >= 12 ? "PM" : "AM";
        const h12 = ((h + 11) % 12) + 1;
        label += `, ${h12}:${String(m).padStart(2, "0")} ${period}`;
      }
      return label;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
    }

    function clearError() {
      errorMsg.classList.add("hidden");
      errorMsg.textContent = "";
    }

    function showToast(message, action) {
      clearTimeout(toastTimer);
      toastMessage.textContent = message;
      toastEl.classList.remove("hidden");
      toastEl.classList.add("flex");
      toastEl.classList.remove("toast-in");
      void toastEl.offsetWidth;
      toastEl.classList.add("toast-in");

      if (action) {
        toastAction.textContent = action.label;
        toastAction.classList.remove("hidden");
        toastAction.onclick = () => {
          hideToast();
          action.onClick();
        };
      } else {
        toastAction.classList.add("hidden");
        toastAction.onclick = null;
      }

      toastTimer = setTimeout(hideToast, action ? 5000 : 3000);
    }

    function hideToast() {
      toastEl.classList.add("hidden");
      toastEl.classList.remove("flex");
    }

    function hideClarify() {
      clarifyBox.classList.add("hidden");
    }

    function setLoading(loading) {
      sendBtn.disabled = loading;
      sendIcon.classList.toggle("hidden", loading);
      loadingDots.classList.toggle("hidden", !loading);
      loadingDots.classList.toggle("flex", loading);
    }

    // ---------- rendering ----------

    function renderTasks(tasks) {
      if (tasks.length === 0) {
        emptyState.classList.remove("hidden");
        taskListEl.classList.add("hidden");
        return;
      }
      emptyState.classList.add("hidden");
      taskListEl.classList.remove("hidden");

      const pending = tasks.filter((t) => t.status !== "completed");
      const completed = tasks.filter((t) => t.status === "completed");

      pendingListEl.innerHTML = "";
      pending.forEach((t) => pendingListEl.appendChild(renderTaskRow(t)));

      if (completed.length > 0) {
        completedSection.classList.remove("hidden");
        completedCount.textContent = `Completed (${completed.length})`;
        completedListEl.innerHTML = "";
        completed.forEach((t) => completedListEl.appendChild(renderTaskRow(t)));
      } else {
        completedSection.classList.add("hidden");
      }
    }

    function renderTaskRow(task) {
      const isDone = task.status === "completed";
      const row = document.createElement("div");
      row.className = "task-row flex items-start gap-3 py-3 border-t border-[#EAE7DE] dark:border-[#2B302C] first:border-t-0";

      const dotClass = PRIORITY_DOT[task.priority] || PRIORITY_DOT.Medium;
      const due = formatDue(task.due_date, task.due_time);
      const metaParts = [due, task.category].filter(Boolean).map(escapeHtml);

      row.innerHTML = `
        <button class="check-btn shrink-0 mt-0.5 h-5 w-5 rounded-full border-2 flex items-center justify-center transition-colors ${
          isDone
            ? "bg-[#3F6652] dark:bg-[#6B9C82] border-[#3F6652] dark:border-[#6B9C82] text-white dark:text-[#1B1F1C]"
            : "border-[#DAD8D0] dark:border-[#3D453F] text-transparent hover:border-[#3F6652] dark:hover:border-[#6B9C82]"
        }" title="${isDone ? "Mark as not done" : "Mark as done"}">
          ${CHECK_ICON}
        </button>
        <div class="min-w-0 flex-1">
          <div class="text-[15px] font-medium ${isDone ? "line-through text-[#A6A296] dark:text-[#6B7269]" : "text-[#1F2420] dark:text-[#EDEDE6]"}">${escapeHtml(task.title)}</div>
          ${metaParts.length ? `<div class="text-xs text-[#8C897E] dark:text-[#8B948C] mt-1">${metaParts.join(" &nbsp;·&nbsp; ")}</div>` : ""}
        </div>
        <div class="flex items-center gap-2 shrink-0 pt-0.5">
          ${!isDone ? `<span class="flex items-center gap-1.5 text-xs text-[#7A776E] dark:text-[#8B948C]"><span class="h-1.5 w-1.5 rounded-full ${dotClass}"></span>${task.priority}</span>` : ""}
          <button class="delete-btn h-8 w-8 sm:h-7 sm:w-7 flex items-center justify-center rounded-full text-[#A6A296] dark:text-[#6B7269] hover:text-[#B3401F] dark:hover:text-[#E08A6B] hover:bg-[#F0EEE6] dark:hover:bg-white/5 transition-colors" title="Delete">
            ${DELETE_ICON}
          </button>
        </div>
      `;

      row.querySelector(".check-btn").addEventListener("click", () => {
        toggleStatus(task.id, isDone ? "pending" : "completed");
      });
      row.querySelector(".delete-btn").addEventListener("click", () => {
        removeTask(task);
      });

      return row;
    }

    // ---------- data ----------

    async function fetchTasks() {
      const res = await fetch(`${API_BASE}/tasks`);
      const tasks = await res.json();
      renderTasks(tasks);
      return tasks;
    }

    async function toggleStatus(id, status) {
      await fetch(`${API_BASE}/tasks/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status }),
      });
      fetchTasks();
    }

    async function removeTask(task) {
      const res = await fetch(`${API_BASE}/tasks/${task.id}`, { method: "DELETE" });
      if (!res.ok) {
        showError("Couldn't delete that task.");
        return;
      }
      const snapshot = await res.json();
      await fetchTasks();
      showToast(`Deleted: ${snapshot.title}`, {
        label: "Undo",
        onClick: () => restoreTask(snapshot),
      });
    }

    async function restoreTask(snapshot) {
      await fetch(`${API_BASE}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(snapshot),
      });
      fetchTasks();
    }

    // ---------- commands ----------

    async function sendCommand(text) {
      clearError();
      hideClarify();
      setLoading(true);
      try {
        const res = await fetch(`${API_BASE}/command`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || "Something went wrong.");
          return;
        }

        if (data.status === "ok") {
          renderTasks(data.tasks);
          const deleted = (data.actions || []).find((a) => a.type === "deleted");
          if (deleted) {
            showToast(data.message, { label: "Undo", onClick: () => restoreTask(deleted.task) });
          } else {
            showToast(data.message);
          }
          noteInput.value = "";
          noteInput.style.height = "auto";
        } else if (data.status === "clarification_needed") {
          showClarify(data.question, data.options || []);
        } else {
          showError(data.message || "Something went wrong.");
        }
      } catch (err) {
        showError("Something went wrong. Is the server running?");
      } finally {
        setLoading(false);
        noteInput.focus();
      }
    }

    function showClarify(question, options) {
      clarifyQuestion.textContent = question;
      clarifyOptions.innerHTML = "";
      options.forEach((opt) => {
        const chip = document.createElement("button");
        chip.className = "text-xs px-3 py-1.5 rounded-full border border-[#E4E1D8] dark:border-[#333A34] text-[#1F2420] dark:text-[#EDEDE6] hover:border-[#3F6652] dark:hover:border-[#6B9C82] transition-colors";
        chip.textContent = opt;
        chip.addEventListener("click", () => sendCommand(opt));
        clarifyOptions.appendChild(chip);
      });
      clarifyBox.classList.remove("hidden");
    }

    function submitFromComposer() {
      const text = noteInput.value.trim();
      if (!text) {
        showError("Please type or speak something first.");
        return;
      }
      sendCommand(text);
    }

    sendBtn.addEventListener("click", submitFromComposer);

    completedToggle.addEventListener("click", () => {
      const isHidden = completedListEl.classList.toggle("hidden");
      completedChevron.style.transform = isHidden ? "rotate(0deg)" : "rotate(90deg)";
    });

    // Auto-grow the textarea like a chat composer
    noteInput.addEventListener("input", () => {
      noteInput.style.height = "auto";
      noteInput.style.height = Math.min(noteInput.scrollHeight, 160) + "px";
    });

    noteInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitFromComposer();
      }
    });

    // Voice input via the Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let listening = false;

      recognition.addEventListener("result", (event) => {
        const transcript = event.results[0][0].transcript;
        noteInput.value = noteInput.value ? `${noteInput.value} ${transcript}` : transcript;
        noteInput.dispatchEvent(new Event("input"));
        clearError();
      });

      recognition.addEventListener("end", () => {
        listening = false;
        micDot.classList.add("hidden");
      });

      recognition.addEventListener("error", () => {
        listening = false;
        micDot.classList.add("hidden");
        showError("Couldn't hear you — check microphone permissions and try again.");
      });

      micBtn.addEventListener("click", () => {
        if (listening) {
          recognition.stop();
          return;
        }
        clearError();
        listening = true;
        micDot.classList.remove("hidden");
        recognition.start();
      });
    } else {
      micBtn.disabled = true;
      micBtn.title = "Voice input not supported in this browser";
      micBtn.classList.add("opacity-30", "cursor-not-allowed");
    }

    // ---------- init ----------
    fetchTasks();
  </script>
</body>
</html>
